<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CronLegível</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <h1>CronLegível</h1>
      <p class="sub">Cole uma expressão cron e veja, em português, quando ela vai rodar.</p>

      <label for="expressao">Expressão cron</label>
      <input id="expressao" type="text" value="*/15 9-18 * * 1-5" spellcheck="false" autocomplete="off" />
      <p class="dica">minuto · hora · dia do mês · mês · dia da semana</p>

      <div class="exemplos" aria-label="Exemplos">
        <button type="button" data-cron="0 9 * * 1-5">dias úteis 9h</button>
        <button type="button" data-cron="*/5 * * * *">a cada 5 min</button>
        <button type="button" data-cron="0 0 1 * *">todo dia 1</button>
        <button type="button" data-cron="30 2 * * 0">domingo 2h30</button>
      </div>

      <section id="resultado" aria-live="polite">
        <p id="descricao"></p>
        <p id="erro" role="alert"></p>
        <h2 id="titulo-proximas">Próximas execuções</h2>
        <ol id="proximas"></ol>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
